# One-time cluster setup - run manually when needed
steps:
  - id: Get-Credentials
    name: "gcr.io/cloud-builders/gcloud"
    args:
      - container
      - clusters
      - get-credentials
      - dfloo-profile-cluster
      - "--region=us-west1"
      - "--project=$PROJECT_ID"

  - id: Install-CSI-Driver
    name: "gcr.io/cloud-builders/kubectl"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e

        echo "Installing Secrets Store CSI Driver..."

        # Install cluster-scoped resources
        kubectl apply -f https://raw.githubusercontent.com/kubernetes-sigs/secrets-store-csi-driver/v1.4.0/deploy/rbac-secretproviderclass.yaml
        kubectl apply -f https://raw.githubusercontent.com/kubernetes-sigs/secrets-store-csi-driver/v1.4.0/deploy/csidriver.yaml
        kubectl apply -f https://raw.githubusercontent.com/kubernetes-sigs/secrets-store-csi-driver/v1.4.0/deploy/secrets-store.csi.x-k8s.io_secretproviderclasses.yaml
        kubectl apply -f https://raw.githubusercontent.com/kubernetes-sigs/secrets-store-csi-driver/v1.4.0/deploy/secrets-store.csi.x-k8s.io_secretproviderclasspodstatuses.yaml

        # Download and install the DaemonSet
        kubectl apply -f https://raw.githubusercontent.com/kubernetes-sigs/secrets-store-csi-driver/v1.4.0/deploy/secrets-store-csi-driver.yaml

        # Install GCP provider
        echo "Installing GCP Secrets Store Provider..."
        kubectl apply -f https://raw.githubusercontent.com/GoogleCloudPlatform/secrets-store-csi-driver-provider-gcp/v1.4.1/deploy/provider-gcp-plugin.yaml

        # Wait for pods
        echo "Waiting for CSI driver pods to be ready..."
        kubectl wait --for=condition=ready pod \
          -l app=secrets-store-csi-driver \
          -n kube-system --timeout=120s || true

        kubectl wait --for=condition=ready pod \
          -l app=csi-secrets-store-provider-gcp \
          -n kube-system --timeout=60s || true

        echo "CSI Driver installation complete!"
        kubectl get pods -n kube-system | grep -E "secrets-store|csi-secrets-store"
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

options:
  logging: CLOUD_LOGGING_ONLY
