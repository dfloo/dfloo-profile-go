apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  namespace: dfloo-profile
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 600
  template:
    spec:
      automountServiceAccountToken: true
      serviceAccountName: dfloo-profile-ksa
      tolerations:
        - key: "node.gke.io/balloon-pod-resize"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: migrate
          image: migrate/migrate
          command:
            - "sh"
            - "-c"
            - |
              export PGDATABASE="$(cat /mnt/secrets-store/postgres-db)"
              export PGUSER="$(cat /mnt/secrets-store/postgres-user)"
              export PGPASSWORD="$(cat /mnt/secrets-store/postgres-password)"
              until nc -z -w 2 127.0.0.1 5432; do
                echo "Waiting for cloud-sql-proxy...";
                sleep 1;
              done;
              echo "cloud-sql-proxy is ready. Running migrations."
              migrate -path /migrations -database "postgres://?sslmode=disable" up
          env:
            - name: PGHOST
              value: "127.0.0.1"
            - name: PGPORT
              value: "5432"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          volumeMounts:
            - name: migrations
              mountPath: /migrations
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true
        - name: cloud-sql-proxy
          image: gcr.io/cloudsql-docker/gce-proxy:1.33.9
          command:
            - "sh"
            - "-c"
            - "exec /cloud_sql_proxy -instances=$(cat /mnt/secrets-store/sql-instance-connection-name)=tcp:5432"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - configMapRef:
                name: app-config
          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: migrations
          configMap:
            name: db-migrations
        - name: secrets-store-inline
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "app-secrets-provider"
      restartPolicy: OnFailure
