apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  namespace: dfloo-profile
spec:
  template:
    spec:
      serviceAccountName: ksa-secret-manager
      initContainers:
        - name: wait-for-postgres
          image: postgres:15
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U $POSTGRES_USER; do
                echo "Waiting for database...";
                sleep 2;
              done;
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
      containers:
        - name: migrate
          image: migrate/migrate
          command:
            - "sh"
            - "-c"
            - 'migrate -path /migrations -database "$(DATABASE_URL)" up'
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_URL
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          configMap:
            name: db-migrations
      restartPolicy: OnFailure
