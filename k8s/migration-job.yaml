apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  namespace: dfloo-profile
spec:
  template:
    spec:
      serviceAccountName: dfloo-profile-ksa
      containers:
        - name: migrate
          image: migrate/migrate
          command:
            - "sh"
            - "-c"
            - |
              until nc -z -w 2 127.0.0.1 5432; do
                echo "Waiting for cloud-sql-proxy...";
                sleep 1;
              done;
              echo "cloud-sql-proxy is ready. Running migrations."
              migrate -path /migrations -database "postgres://?sslmode=disable" up
          env:
            - name: PGHOST
              value: "127.0.0.1"
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_DB
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          volumeMounts:
            - name: migrations
              mountPath: /migrations
        - name: cloud-sql-proxy
          image: gcr.io/cloudsql-docker/gce-proxy:1.33.9
          command:
            - "/cloud_sql_proxy"
            - "-instances=$(SQL_INSTANCE_CONNECTION_NAME)=tcp:5432"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - secretRef:
                name: app-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "100m"
      volumes:
        - name: migrations
          configMap:
            name: db-migrations
      restartPolicy: OnFailure
