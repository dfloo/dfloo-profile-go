apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  namespace: dfloo-profile
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 600
  template:
    spec:
      automountServiceAccountToken: true
      serviceAccountName: dfloo-profile-ksa
      tolerations:
        - key: "node.gke.io/balloon-pod-resize"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: migrate
          image: migrate/migrate
          command:
            - "sh"
            - "-c"
            - |
              export PGDATABASE="$(cat /mnt/secrets-store/postgres-db)"
              export PGUSER="$(cat /mnt/secrets-store/postgres-user)"
              export PGPASSWORD="$(cat /mnt/secrets-store/postgres-password)"
              DSN="postgres://${PGUSER}:${PGPASSWORD}@localhost/${PGDATABASE}?host=/cloudsql/$(cat /mnt/secrets-store/sql-instance-connection-name)"
              echo "Running migrations..."
              for i in $(seq 1 60); do
                migrate -path /migrations -database "${DSN}" up && exit 0
                echo "Retry $i: database not reachable yet"
                sleep 5
              done
              echo "Migrations failed after retries"; exit 1
          env:
            - name: PGHOST
              value: "127.0.0.1"
            - name: PGPORT
              value: "5432"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          volumeMounts:
            - name: migrations
              mountPath: /migrations
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true
            - name: cloudsql-socket
              mountPath: /cloudsql
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:buster
          command:
            - "sh"
            - "-c"
            - |
              /cloud-sql-proxy \
                --unix-socket=/cloudsql \
                "$(cat /mnt/secrets-store/sql-instance-connection-name)"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - configMapRef:
                name: app-config
          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true
            - name: cloudsql-socket
              mountPath: /cloudsql
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: migrations
          configMap:
            name: db-migrations
        - name: cloudsql-socket
          emptyDir: {}
        - name: secrets-store-inline
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "app-secrets-provider"
      restartPolicy: OnFailure
