apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: app-secrets-provider
  namespace: dfloo-profile
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/dfloo-profile/secrets/POSTGRES_USER/versions/latest"
        path: "postgres-user"
      - resourceName: "projects/dfloo-profile/secrets/POSTGRES_PASSWORD/versions/latest"
        path: "postgres-password"
      - resourceName: "projects/dfloo-profile/secrets/DATABASE_URL/versions/latest"
        path: "database-url"
  secretObjects:
    - secretName: app-secrets
      type: Opaque
      data:
        - objectName: "postgres-user"
          key: "POSTGRES_USER"
        - objectName: "postgres-password"
          key: "POSTGRES_PASSWORD"
        - objectName: "database-url"
          key: "DATABASE_URL"
