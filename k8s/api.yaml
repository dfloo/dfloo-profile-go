apiVersion: v1
kind: Service
metadata:
  name: dfloo-profile-api
  namespace: dfloo-profile
spec:
  selector:
    app: dfloo-profile-api
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dfloo-profile-api
  namespace: dfloo-profile
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dfloo-profile-api
  template:
    metadata:
      labels:
        app: dfloo-profile-api
    spec:
      serviceAccountName: ksa-secret-manager
      containers:
        - name: api
          image: gcr.io/dfloo-profile/dfloo-profile-go:latest
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_URL
            - name: AUTH0_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AUTH0_AUDIENCE
            - name: AUTH0_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AUTH0_DOMAIN
            - name: CLIENT_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: CLIENT_ORIGIN
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets"
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: app-secrets-provider
