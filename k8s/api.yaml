apiVersion: v1
kind: Service
metadata:
  name: dfloo-profile-api
  namespace: dfloo-profile
  annotations:
    cloud.google.com/backend-config: '{"default": "api-backend-config"}'
    cloud.google.com/neg: '{"ingress": true}'
spec:
  selector:
    app: dfloo-profile-api
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dfloo-profile-api
  namespace: dfloo-profile
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dfloo-profile-api
  template:
    metadata:
      labels:
        app: dfloo-profile-api
    spec:
      serviceAccountName: dfloo-profile-k8s
      containers:
        - name: api
          image: gcr.io/dfloo-profile/dfloo-profile-go:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: PGHOST
              value: "127.0.0.1"
            - name: PGPORT
              value: "5432"
            - name: HOME
              value: "/tmp"
            - name: TEXMFCACHE
              value: "/tmp/texmf-cache"
            - name: TEXMFVAR
              value: "/tmp/texmf-cache"
            - name: AUTH0_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AUTH0_AUDIENCE
            - name: AUTH0_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AUTH0_DOMAIN
            - name: CLIENT_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: CLIENT_ORIGIN
          command:
            - "sh"
            - "-c"
            - |
              export PGDATABASE=$(cat /mnt/secrets-store/postgres-db)
              export PGUSER=$(cat /mnt/secrets-store/postgres-user)
              export PGPASSWORD=$(cat /mnt/secrets-store/postgres-password)
              mkdir -p "$HOME" "$TEXMFCACHE" "$TEXMFVAR" /tmp/tex-warmup
              cat > /tmp/tex-warmup/warmup.tex <<'EOF'
              \documentclass{article}
              \begin{document}
              warmup
              \end{document}
              EOF
              lualatex -interaction=nonstopmode -halt-on-error -output-directory /tmp/tex-warmup /tmp/tex-warmup/warmup.tex > /tmp/tex-warmup/lualatex.log 2>&1 || true
              /dfloo-profile-go
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "200m"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true
            - name: tex-cache
              mountPath: "/tmp/texmf-cache"
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:buster
          command:
            - "sh"
            - "-c"
            - |
              /cloud-sql-proxy \
                --structured-logs \
                --port=5432 \
                "$(cat /mnt/secrets-store/sql-instance-connection-name)"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "app-secrets-provider"
        - name: tex-cache
          emptyDir:
            sizeLimit: "256Mi"
