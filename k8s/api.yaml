apiVersion: v1
kind: Service
metadata:
  name: dfloo-profile-api
  namespace: dfloo-profile
  annotations:
    cloud.google.com/backend-config: '{"default": "api-backend-config"}'
spec:
  selector:
    app: dfloo-profile-api
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dfloo-profile-api
  namespace: dfloo-profile
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dfloo-profile-api
  template:
    metadata:
      labels:
        app: dfloo-profile-api
    spec:
      serviceAccountName: dfloo-profile-sa
      containers:
        - name: api
          image: gcr.io/dfloo-profile/dfloo-profile-go:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: PGHOST
              value: "127.0.0.1"
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_DB
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            - name: AUTH0_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AUTH0_AUDIENCE
            - name: AUTH0_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AUTH0_DOMAIN
            - name: CLIENT_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: CLIENT_ORIGIN
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
        - name: cloud-sql-proxy
          image: gcr.io/cloudsql-docker/gce-proxy:1.33.9
          command:
            - "sh"
            - "-c"
            - "/cloud_sql_proxy -instances=${SQL_INSTANCE_CONNECTION_NAME}=tcp:5432"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - secretRef:
                name: app-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "100m"
