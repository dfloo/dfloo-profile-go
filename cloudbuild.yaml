steps:
  - id: Build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - "--no-cache"
      - "-t"
      - "gcr.io/$PROJECT_ID/dfloo-profile-go:$COMMIT_SHA"
      - "-t"
      - "gcr.io/$PROJECT_ID/dfloo-profile-go:latest"
      - "-f"
      - Dockerfile
      - "."

  - id: Push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - "--all-tags"
      - "gcr.io/$PROJECT_ID/dfloo-profile-go"

  - id: Get-Credentials
    name: "gcr.io/cloud-builders/gcloud"
    args:
      - container
      - clusters
      - get-credentials
      - dfloo-profile-cluster
      - "--region=us-west1"
      - "--project=$PROJECT_ID"

  - id: Apply-Manifests
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - apply
      - "-f"
      - k8s/namespace.yaml
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Apply-ConfigMap
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - apply
      - "-f"
      - k8s/configmap.yaml
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Apply-Service-Account
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - apply
      - "-f"
      - k8s/service-account.yaml
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Apply-Secret-Provider
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - apply
      - "-f"
      - k8s/secret-provider.yaml
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Wait-For-Secret-Creation
    name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        echo "Waiting 15 seconds for the Secret Store CSI driver to create the secret..."
        sleep 15

  - id: Apply-Migrations-ConfigMap
    name: "gcr.io/cloud-builders/kubectl"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        kubectl create configmap db-migrations \
          --from-file=db/migrations/ \
          --namespace=dfloo-profile \
          --dry-run=client -o yaml | kubectl apply -f -
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Delete-Old-Migration-Job
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - delete
      - job
      - db-migration
      - "-n"
      - "dfloo-profile"
      - "--ignore-not-found"
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Run-Migrations
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - apply
      - "-f"
      - k8s/migration-job.yaml
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Wait-And-Debug-Migrations
    name: "gcr.io/cloud-builders/kubectl"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        echo "Waiting for migration job to complete..."
        kubectl wait --for=condition=complete job/db-migration -n dfloo-profile --timeout=300s
        if [[ "$$?" -ne 0 ]]; then
          echo "Migration job failed to complete. Debugging..."

          echo "--- Describing migration job ---"
          kubectl describe job db-migration -n dfloo-profile || true

          echo "--- Recent events mentioning the job or pods ---"
          kubectl get events -n dfloo-profile --sort-by='.metadata.creationTimestamp' | tail -n 200 || true

          echo "--- Looking for pods with label job-name=db-migration ---"
          PODS=$$(kubectl get pods -n dfloo-profile -l job-name=db-migration -o jsonpath='{range .items[*]}{.metadata.name}{" "}{end}')
          if [[ -n "$$PODS" ]]; then
            for P in $$PODS; do
              echo "---- Found pod: $$P ----"
              kubectl describe pod $$P -n dfloo-profile || true
              echo "---- Pod YAML ----"
              kubectl get pod $$P -n dfloo-profile -o yaml || true

              echo "---- Logs for migrate container (current) ----"
              kubectl logs $$P -n dfloo-profile -c migrate --tail=200 || true
              echo "---- Logs for migrate container (previous) ----"
              kubectl logs $$P -n dfloo-profile -c migrate --previous --tail=200 || true

              echo "---- Logs for cloud-sql-proxy container (current) ----"
              kubectl logs $$P -n dfloo-profile -c cloud-sql-proxy --tail=200 || true
              echo "---- Logs for cloud-sql-proxy container (previous) ----"
              kubectl logs $$P -n dfloo-profile -c cloud-sql-proxy --previous --tail=200 || true
            done
          else
            echo "No pods found for the job. Listing recent pods and events in namespace:"
            kubectl get pods -n dfloo-profile -o wide --sort-by='.metadata.creationTimestamp' | tail -n 50 || true
            kubectl get events -n dfloo-profile --sort-by='.metadata.creationTimestamp' | tail -n 200 || true
          fi

          exit 1
        else
          echo "Migration job completed successfully."
        fi
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Apply-BackendConfig
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - apply
      - "-f"
      - k8s/backend-config.yaml
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Apply-API
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - apply
      - "-f"
      - k8s/api.yaml
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Update-API-Image
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - set
      - image
      - "deployment/dfloo-profile-api"
      - "api=gcr.io/$PROJECT_ID/dfloo-profile-go:$COMMIT_SHA"
      - "-n"
      - "dfloo-profile"
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Wait-API-Rollout
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - rollout
      - status
      - deployment/dfloo-profile-api
      - "-n"
      - dfloo-profile
      - --timeout=300s
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Apply-Ingress
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - apply
      - "-f"
      - k8s/ingress.yaml
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Get-Ingress
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - get
      - ingress
      - dfloo-profile-ingress
      - "-n"
      - "dfloo-profile"
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

images:
  - "gcr.io/$PROJECT_ID/dfloo-profile-go:$COMMIT_SHA"
  - "gcr.io/$PROJECT_ID/dfloo-profile-go:latest"

options:
  logging: CLOUD_LOGGING_ONLY

tags:
  - gke-deployment
  - dfloo-profile-go
