steps:
  - id: Build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - "--no-cache"
      - "-t"
      - "gcr.io/$PROJECT_ID/dfloo-profile-go:$COMMIT_SHA"
      - "-t"
      - "gcr.io/$PROJECT_ID/dfloo-profile-go:latest"
      - "-f"
      - Dockerfile
      - "."

  - id: Push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - "--all-tags"
      - "gcr.io/$PROJECT_ID/dfloo-profile-go"

  - id: Get-Credentials
    name: "gcr.io/cloud-builders/gcloud"
    args:
      - container
      - clusters
      - get-credentials
      - dfloo-profile-cluster
      - "--region=us-west1"
      - "--project=$PROJECT_ID"

  - id: Apply-Manifests
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - apply
      - "-f"
      - k8s/namespace.yaml
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Apply-ConfigMap
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - apply
      - "-f"
      - k8s/configmap.yaml
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Apply-Service-Account
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - apply
      - "-f"
      - k8s/service-account.yaml
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Apply-Postgres-PVC
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - apply
      - "-f"
      - k8s/postgres-pvc.yaml
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Create-Secrets
    name: "gcr.io/cloud-builders/kubectl"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        set -o pipefail

        # Fetch DB name from ConfigMap
        DB_NAME=$(kubectl get configmap app-config -n dfloo-profile -o jsonpath='{.data.POSTGRES_DB}')
        echo "Found database name: $$DB_NAME"

        echo "Creating app-secrets..."
        kubectl create secret generic app-secrets \
          --namespace=dfloo-profile \
          --from-literal=POSTGRES_USER="$$POSTGRES_USER" \
          --from-literal=POSTGRES_PASSWORD="$$POSTGRES_PASSWORD" \
          --from-literal=DATABASE_URL="postgres://$$POSTGRES_USER:$$POSTGRES_PASSWORD@postgres:5432/$$DB_NAME?sslmode=disable" \
          --dry-run=client -o yaml | kubectl apply -f -
        echo "Secret created."
    secretEnv: ["POSTGRES_USER", "POSTGRES_PASSWORD"]
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Apply-Postgres
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - apply
      - "-f"
      - k8s/postgres.yaml
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Restart-Postgres
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - delete
      - pod
      - "-l"
      - "app=postgres"
      - "-n"
      - "dfloo-profile"
      - "--ignore-not-found"
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Debug-Postgres
    name: "gcr.io/cloud-builders/kubectl"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        echo "=== Checking Postgres Deployment ==="
        kubectl get deployment postgres -n dfloo-profile -o wide
        echo ""
        echo "=== Checking Postgres Pods ==="
        kubectl get pods -l app=postgres -n dfloo-profile -o wide
        echo ""
        echo "=== Checking PVC Status ==="
        kubectl get pvc postgres-pvc -n dfloo-profile
        echo ""
        echo "=== Checking Postgres Events ==="
        kubectl get events -n dfloo-profile --sort-by='.lastTimestamp' | tail -20
        echo ""
        echo "=== Pod Descriptions ==="
        kubectl describe pods -l app=postgres -n dfloo-profile || true
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Wait-Postgres
    name: "gcr.io/cloud-builders/kubectl"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        echo "Waiting for Postgres to be ready (600s timeout)..."
        if ! kubectl wait --for=condition=available deployment/postgres -n dfloo-profile --timeout=600s; then
          echo "Postgres failed to become ready within timeout. Debugging..."
          echo ""
          echo "=== POD STATUS ==="
          kubectl get pods -n dfloo-profile -l app=postgres
          echo ""
          echo "=== EVENTS (Last 50) ==="
          kubectl get events -n dfloo-profile --sort-by='.lastTimestamp' | tail -50
          echo ""
          echo "=== POD LOGS ==="
          kubectl logs -l app=postgres -n dfloo-profile --tail=100 --all-containers=true
          echo ""
          echo "=== POD DESCRIBE ==="
          kubectl describe pod -l app=postgres -n dfloo-profile
          exit 1 # Fail the build
        fi
        echo "Postgres is ready."
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Apply-Migrations-ConfigMap
    name: "gcr.io/cloud-builders/kubectl"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        kubectl create configmap db-migrations \
          --from-file=db/migrations/ \
          --namespace=dfloo-profile \
          --dry-run=client -o yaml | kubectl apply -f -
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Delete-Old-Migration-Job
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - delete
      - job
      - db-migration
      - "-n"
      - "dfloo-profile"
      - "--ignore-not-found"
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Run-Migrations
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - apply
      - "-f"
      - k8s/migration-job.yaml
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Wait-And-Debug-Migrations
    name: "gcr.io/cloud-builders/kubectl"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        echo "Waiting for DB Migrations to complete (300s timeout)..."
        if ! kubectl wait --for=condition=complete job/db-migration -n dfloo-profile --timeout=300s; then
          echo "Migrations failed to complete within timeout. Debugging..."
          echo ""
          echo "=== JOB STATUS ==="
          kubectl get jobs -n dfloo-profile
          echo ""
          echo "=== POD STATUS ==="
          kubectl get pods -n dfloo-profile -l job-name=db-migration
          echo ""
          echo "=== JOB LOGS ==="
          kubectl logs job/db-migration -n dfloo-profile --tail=100 || echo "Unable to fetch logs"
          echo ""
          echo "=== JOB DESCRIBE ==="
          kubectl describe job db-migration -n dfloo-profile
          echo ""
          echo "=== POD DESCRIBE ==="
          kubectl describe pods -l job-name=db-migration -n dfloo-profile
          exit 1
        fi
        echo "Migrations completed successfully"
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Apply-API
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - apply
      - "-f"
      - k8s/api.yaml
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Update-API-Image
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - set
      - image
      - "deployment/dfloo-profile-api"
      - "api=gcr.io/$PROJECT_ID/dfloo-profile-go:$COMMIT_SHA"
      - "-n"
      - "dfloo-profile"
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Wait-API-Rollout
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - rollout
      - status
      - "deployment/dfloo-profile-api"
      - "-n"
      - "dfloo-profile"
      - "--timeout=300s"
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Get-Service
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - get
      - service
      - dfloo-profile-api
      - "-n"
      - "dfloo-profile"
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

images:
  - "gcr.io/$PROJECT_ID/dfloo-profile-go:$COMMIT_SHA"
  - "gcr.io/$PROJECT_ID/dfloo-profile-go:latest"

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/POSTGRES_USER/versions/latest
      env: POSTGRES_USER
    - versionName: projects/$PROJECT_ID/secrets/POSTGRES_PASSWORD/versions/latest
      env: POSTGRES_PASSWORD

options:
  logging: CLOUD_LOGGING_ONLY

tags:
  - gke-deployment
  - dfloo-profile-go
