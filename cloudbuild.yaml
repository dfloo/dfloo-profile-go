steps:
  - id: Build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - "--no-cache"
      - "-t"
      - "gcr.io/$PROJECT_ID/dfloo-profile-go:$COMMIT_SHA"
      - "-t"
      - "gcr.io/$PROJECT_ID/dfloo-profile-go:latest"
      - "-f"
      - Dockerfile
      - "."

  - id: Push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - "--all-tags"
      - "gcr.io/$PROJECT_ID/dfloo-profile-go"

  - id: Get-Credentials
    name: "gcr.io/cloud-builders/gcloud"
    args:
      - container
      - clusters
      - get-credentials
      - dfloo-profile-cluster
      - "--region=us-west1"
      - "--project=$PROJECT_ID"

  - id: Apply-Manifests
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - apply
      - "-f"
      - k8s/namespace.yaml
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Apply-ConfigMap
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - apply
      - "-f"
      - k8s/configmap.yaml
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Apply-Service-Account
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - apply
      - "-f"
      - k8s/service-account.yaml
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Apply-Postgres-PVC
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - apply
      - "-f"
      - k8s/postgres-pvc.yaml
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Create-Secrets
    name: "gcr.io/cloud-builders/kubectl"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        set -o pipefail
        echo "Creating app-secrets..."
        kubectl create secret generic app-secrets \
          --namespace=dfloo-profile \
          --from-literal=POSTGRES_USER="$$POSTGRES_USER" \
          --from-literal=POSTGRES_PASSWORD="$$POSTGRES_PASSWORD" \
          --from-literal=DATABASE_URL="$$DATABASE_URL" \
          --dry-run=client -o yaml | kubectl apply -f -
        echo "Secret created."
    secretEnv: ["POSTGRES_USER", "POSTGRES_PASSWORD", "DATABASE_URL"]
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Apply-Postgres
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - apply
      - "-f"
      - k8s/postgres.yaml
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Wait-Postgres
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - wait
      - --for=condition=available
      - deployment/postgres
      - "-n"
      - dfloo-profile
      - --timeout=300s
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Apply-Migrations-ConfigMap
    name: "gcr.io/cloud-builders/kubectl"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        kubectl create configmap db-migrations \
          --from-file=db/migrations/ \
          --namespace=dfloo-profile \
          --dry-run=client -o yaml | kubectl apply -f -
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Delete-Old-Migration-Job
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - delete
      - job
      - db-migration
      - "-n"
      - "dfloo-profile"
      - "--ignore-not-found"
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Run-Migrations
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - apply
      - "-f"
      - k8s/migration-job.yaml
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Wait-Migrations
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - wait
      - --for=condition=complete
      - job/db-migration
      - "-n"
      - dfloo-profile
      - --timeout=300s
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Apply-BackendConfig
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - apply
      - "-f"
      - k8s/backend-config.yaml
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Apply-API
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - apply
      - "-f"
      - k8s/api.yaml
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Update-API-Image
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - set
      - image
      - "deployment/dfloo-profile-api"
      - "api=gcr.io/$PROJECT_ID/dfloo-profile-go:$COMMIT_SHA"
      - "-n"
      - "dfloo-profile"
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Wait-API-Rollout
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - rollout
      - status
      - deployment/dfloo-profile-api
      - "-n"
      - dfloo-profile
      - --timeout=300s
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Apply-Ingress
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - apply
      - "-f"
      - k8s/ingress.yaml
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Get-Ingress
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - get
      - ingress
      - dfloo-profile-ingress
      - "-n"
      - "dfloo-profile"
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

images:
  - "gcr.io/$PROJECT_ID/dfloo-profile-go:$COMMIT_SHA"
  - "gcr.io/$PROJECT_ID/dfloo-profile-go:latest"

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/POSTGRES_USER/versions/latest
      env: POSTGRES_USER
    - versionName: projects/$PROJECT_ID/secrets/POSTGRES_PASSWORD/versions/latest
      env: POSTGRES_PASSWORD
    - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
      env: DATABASE_URL

options:
  logging: CLOUD_LOGGING_ONLY

tags:
  - gke-deployment
  - dfloo-profile-go
