steps:
  - id: Build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - "--no-cache"
      - "-t"
      - "gcr.io/$PROJECT_ID/dfloo-profile-go:$COMMIT_SHA"
      - "-t"
      - "gcr.io/$PROJECT_ID/dfloo-profile-go:latest"
      - "-f"
      - Dockerfile
      - "."

  - id: Push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - "--all-tags"
      - "gcr.io/$PROJECT_ID/dfloo-profile-go"

  - id: Get-Credentials
    name: "gcr.io/cloud-builders/gcloud"
    args:
      - container
      - clusters
      - get-credentials
      - dfloo-profile-cluster
      - "--region=us-west1"
      - "--project=$PROJECT_ID"

  - id: Apply-Manifests
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - apply
      - "-f"
      - k8s/namespace.yaml
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Apply-ConfigMap
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - apply
      - "-f"
      - k8s/configmap.yaml
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Apply-Service-Account
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - apply
      - "-f"
      - k8s/service-account.yaml
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Apply-Postgres-PVC
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - apply
      - "-f"
      - k8s/postgres-pvc.yaml
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Apply-Postgres
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - apply
      - "-f"
      - k8s/postgres.yaml
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Debug-Postgres
    name: "gcr.io/cloud-builders/kubectl"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        echo "=== Checking Postgres Deployment ==="
        kubectl get deployment postgres -n dfloo-profile -o wide
        echo ""
        echo "=== Checking Postgres Pods ==="
        kubectl get pods -l app=postgres -n dfloo-profile -o wide
        echo ""
        echo "=== Checking PVC Status ==="
        kubectl get pvc postgres-pvc -n dfloo-profile
        echo ""
        echo "=== Checking Postgres Events ==="
        kubectl get events -n dfloo-profile --sort-by='.lastTimestamp' | tail -20
        echo ""
        echo "=== Pod Descriptions ==="
        kubectl describe pods -l app=postgres -n dfloo-profile || true
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Wait-Postgres
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - wait
      - "--for=condition=available"
      - "deployment/postgres"
      - "-n"
      - "dfloo-profile"
      - "--timeout=300s"
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Apply-Migrations-ConfigMap
    name: "gcr.io/cloud-builders/kubectl"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        kubectl create configmap db-migrations \
          --from-file=db/migrations/ \
          --namespace=dfloo-profile \
          --dry-run=client -o yaml | kubectl apply -f -
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Delete-Old-Migration-Job
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - delete
      - job
      - db-migration
      - "-n"
      - "dfloo-profile"
      - "--ignore-not-found"
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Run-Migrations
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - apply
      - "-f"
      - k8s/migration-job.yaml
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Wait-Migrations
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - wait
      - "--for=condition=complete"
      - "job/db-migration"
      - "-n"
      - "dfloo-profile"
      - "--timeout=300s"
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Apply-API
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - apply
      - "-f"
      - k8s/api.yaml
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Update-API-Image
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - set
      - image
      - "deployment/dfloo-profile-api"
      - "api=gcr.io/$PROJECT_ID/dfloo-profile-go:$COMMIT_SHA"
      - "-n"
      - "dfloo-profile"
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Wait-API-Rollout
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - rollout
      - status
      - "deployment/dfloo-profile-api"
      - "-n"
      - "dfloo-profile"
      - "--timeout=300s"
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

  - id: Get-Service
    name: "gcr.io/cloud-builders/kubectl"
    args:
      - get
      - service
      - dfloo-profile-api
      - "-n"
      - "dfloo-profile"
    env:
      - "CLOUDSDK_COMPUTE_REGION=us-west1"
      - "CLOUDSDK_CONTAINER_CLUSTER=dfloo-profile-cluster"

images:
  - "gcr.io/$PROJECT_ID/dfloo-profile-go:$COMMIT_SHA"
  - "gcr.io/$PROJECT_ID/dfloo-profile-go:latest"

options:
  logging: CLOUD_LOGGING_ONLY

tags:
  - gke-deployment
  - dfloo-profile-go
